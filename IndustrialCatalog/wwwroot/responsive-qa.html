<!doctype html><html lang="tr"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INOKSKAR Ekran Kontrolü</title><style>body{margin:0;background:#dae3ed;font:14px Arial}header{position:sticky;top:0;z-index:2;background:#fff;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}iframe{border:0;background:white;display:block;max-width:none}main{padding:12px;width:max-content}label{display:flex;align-items:center;gap:6px}input{width:440px}</style><header><button data-width="390">Mobil 390</button><button data-width="768">Tablet 768</button><button data-width="1280">Masaüstü 1280</button><label>Sayfa <input id="route" value="/"></label><button id="open">Sayfayı aç</button></header><main><iframe title="Kontrol edilen site" src="/" width="390" height="844"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{f.width=b.dataset.width;f.height=b.dataset.width==='390'?844:b.dataset.width==='768'?1024:900});document.querySelector('#open').onclick=()=>{let p=document.querySelector('#route').value;if(p.startsWith('/')&&!p.startsWith('//'))f.src=p};</script></html>
