<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Görünüm kontrolü</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe6ed;font:13px system-ui;color:#294557}header{height:52px;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border-bottom:1px solid #cbd8e2}select{border:1px solid #c6d6e1;border-radius:7px;padding:7px;font:inherit;background:#fff;color:inherit}main{display:flex;justify-content:center;padding:12px}#stage{background:#fff;box-shadow:0 6px 30px #23445920;overflow:hidden}iframe{border:0;display:block;transform-origin:top left}span{font-size:11px;color:#7990a0}</style></head><body><header><label>Ekran <select id="device"><option value="390,844">Mobil · 390 × 844</option><option value="820,1180">Tablet · 820 × 1180</option><option value="1366,768">PC · 1366 × 768</option></select></label><label>Sayfa <select id="page"><option value="/">Ana sayfa</option><option value="/urunler">Ürünler</option><option value="/kategori/sogutma">Kategori</option><option value="/iletisim?amac=teklif">Teklif talebi</option><option value="/iletisim?amac=servis">Servis talebi</option><option value="/garanti-sorgulama">Garanti sorgulama</option><option value="/talep-sorgula">Talep sorgulama</option><option value="/hakkimizda">Hakkımızda</option><option value="/referanslar">Referanslar</option><option value="/kayit">Müşteri kaydı</option><option value="/login">Giriş</option><option value="/admin">Yönetim</option></select></label><span id="size"></span></header><main><div id="stage"><iframe id="site" title="Gerçek sayfa kontrolü" src="/"></iframe></div></main><script>const frame=document.getElementById('site'),stage=document.getElementById('stage'),device=document.getElementById('device');function resize(){const [w,h]=device.value.split(',').map(Number),scale=Math.min(1,(innerWidth-28)/w,(innerHeight-78)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';document.getElementById('size').textContent=w+' × '+h;}device.onchange=resize;window.onresize=resize;document.getElementById('page').onchange=e=>frame.src=e.target.value;resize();</script></body></html>
