<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İnokskar Görsel Kontrol</title><style>*{box-sizing:border-box}body{margin:0;background:#dde5ef;font-family:Arial}header{display:flex;gap:10px;align-items:center;padding:12px;background:#162c49;color:white;position:sticky;top:0;z-index:3}button,select{padding:9px 14px;border-radius:7px;border:1px solid #b8c9dc;background:#fff;color:#142d4d;font-size:14px}main{padding:16px;display:flex;justify-content:center}iframe{display:block;width:390px;height:780px;border:0;background:white;box-shadow:0 8px 30px #163b6026;border-radius:10px}</style><header><strong>Görsel kontrol</strong><button data-width="390">Mobil 390</button><button data-width="768">Tablet 768</button><button data-width="1280">Masaüstü 1280</button><select aria-label="Sayfa"><option value="/">Ana sayfa</option value="/urunler">Ürünler</option><option value="/kategori/sogutma">Soğutma</option><option value="/kategori/mutfak">Mutfak</option><option value="/kategori/mobilya">Mobilya</option><option value="/urun/ornek-dolap">Ürün detayı</option><option value="/hakkimizda">Hakkımızda</option><option value="/iletisim">İletişim</option><option value="/garanti-sorgulama">Garanti</option><option value="/servis-talebi">Servis</option><option value="/login">Giriş</option><option value="/kayit">Kayıt</option><option value="/forgot-password">Şifre hatırlatma</option></select></header><main><iframe title="İnokskar cihaz görünümü" src="/"></iframe></main><script>const frame=document.querySelector('iframe');const params=new URLSearchParams(location.search);frame.style.width=(params.get('width')||'390')+'px';if(params.get('page'))frame.src=params.get('page');document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width=b.dataset.width+'px';}));document.querySelector('select').addEventListener('change',e=>frame.src=e.target.value);</script></html>
