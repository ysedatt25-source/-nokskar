<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yükleme görünümü</title><style>body{margin:0}.brand-loading{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#151617}.brand-loading-inner{width:min(100%,680px)}.brand-loading-logo{position:relative;overflow:hidden;border-radius:12px}.brand-loading-logo img{display:block;width:100%;height:auto;object-fit:contain}.brand-loading-logo>span{position:absolute;inset:0;transform:translateX(-130%) skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06) 38%,rgba(255,255,255,.23) 50%,rgba(255,255,255,.06) 62%,transparent);animation:brand-loading-shine 1.8s ease-in-out infinite}.brand-loading-track{width:46%;height:3px;background:#ffffff12;border-radius:20px;margin:25px auto 0;overflow:hidden}.brand-loading-track span{display:block;width:42%;height:100%;border-radius:20px;background:linear-gradient(90deg,#1d70cd,#78d8ff,#1d70cd);animation:brand-loading-progress 1.2s ease-in-out infinite}@keyframes brand-loading-shine{to{transform:translateX(130%) skewX(-18deg)}}@keyframes brand-loading-progress{from{transform:translateX(-105%)}to{transform:translateX(345%)}}@media(prefers-reduced-motion:reduce){.brand-loading-logo>span{animation:none;display:none}.brand-loading-track span{animation:none;margin:auto}}
</style><div class="brand-loading" role="status" aria-label="Sayfa yükleniyor"><div class="brand-loading-inner"><div class="brand-loading-logo"><img src="/loading-brand.svg" alt="İNOKSKAR — Soğutma ve Endüstriyel Mutfak"><span aria-hidden="true"></span></div><div class="brand-loading-track" aria-hidden="true"><span></span></div></div></div></html>
