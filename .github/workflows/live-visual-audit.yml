name: Live Visual Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_URL: https://inokskar-web-preview.up.railway.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Playwright
        run: |
          mkdir -p /tmp/inokskar-live-audit
          cd /tmp/inokskar-live-audit
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for exact live release
        run: |
          set -euo pipefail
          expected="r22-3"
          echo "Expected live release: $expected"
          for i in {1..90}; do
            info="$(curl -fsS "$LIVE_URL/build-info" 2>/dev/null || true)"
            actual="$(printf '%s' "$info" | sed -n 's/.*"release":"\([^"]*\)".*/\1/p')"
            if [ "$actual" = "$expected" ]; then
              echo "Exact UI release is live: $actual"
              curl -fsS "$LIVE_URL/healthz"
              exit 0
            fi
            echo "Waiting for Railway release. Current: ${actual:-unavailable}"
            sleep 5
          done
          echo "Expected release did not become live in time"
          curl -fsS "$LIVE_URL/build-info" || true
          exit 1

      - name: Run live Chromium visual and interaction audit
        run: |
          cd /tmp/inokskar-live-audit
          cat > audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = process.env.LIVE_URL;
          const out = process.env.GITHUB_WORKSPACE + '/live-visual-audit';
          fs.mkdirSync(out, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const report = {
            base,
            checkedAt: new Date().toISOString(),
            pages: [],
            interaction: {}
          };

          const devices = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'tablet', width: 820, height: 1180 },
            { name: 'mobile', width: 390, height: 844 }
          ];
          const paths = [
            ['home', '/'],
            ['products', '/urunler'],
            ['login', '/login'],
            ['register', '/kayit'],
            ['forgot', '/forgot-password'],
            ['warranty', '/garanti-sorgulama'],
            ['service', '/servis-talebi'],
            ['contact', '/iletisim'],
            ['about', '/hakkimizda'],
            ['privacy', '/gizlilik'],
            ['kvkk', '/kvkk'],
            ['cookies', '/cerez'],
            ['tracking', '/talep-takip'],
            ['reset-invalid', '/reset-password?token=invalid-audit-token']
          ];
          const catalogResponse = await fetch(base + '/api/catalog');
          const catalogPayload = await catalogResponse.json();
          const catalogProducts = Array.isArray(catalogPayload?.data?.products) ? catalogPayload.data.products : [];
          const firstProductId = catalogProducts[0]?.id || '';
          const productDetailPath = firstProductId ? '/urun/' + encodeURIComponent(firstProductId) : '';
          const imageProduct = catalogProducts
            .filter(p => Array.isArray(p?.images) && p.images.filter(Boolean).length > 0)
            .sort((a,b) => (b.images?.filter(Boolean).length || 0) - (a.images?.filter(Boolean).length || 0))[0];
          const imageProductPath = imageProduct?.id ? '/urun/' + encodeURIComponent(imageProduct.id) : '';
          if (productDetailPath) paths.push(['product-detail', productDetailPath]);
          if (imageProductPath && imageProductPath !== productDetailPath) paths.push(['product-detail-images', imageProductPath]);

          for (const device of devices) {
            const context = await browser.newContext({
              viewport: { width: device.width, height: device.height },
              deviceScaleFactor: 1,
              isMobile: device.name === 'mobile',
              hasTouch: device.name !== 'desktop'
            });
            const page = await context.newPage();

            for (const [name, path] of paths) {
              const detailPage = name.startsWith('product-detail');
              const response = await page.goto(base + path, { waitUntil: detailPage ? 'domcontentloaded' : 'networkidle', timeout: 45000 });
              if(detailPage) await page.locator('.detail').first().waitFor({state:'visible',timeout:10000});
              await page.waitForTimeout(detailPage ? 700 : 350);
              const status = response?.status() ?? 0;
              const bodyWidth = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body?.scrollWidth || 0
              }));
              const overflow = bodyWidth.scrollWidth > bodyWidth.innerWidth + 2;
              const majorLeaks = await page.evaluate(() => {
                const selectors = [
                  '.wrap','.page-intro','.catalogue','.content-page','.detail','.detail-grid',
                  '.product-gallery','.detail-photo','.detail-summary','.detail-trust-row',
                  '.detail-trust-row>*','.product-details','.contact-grid','.contact-info',
                  '.inquiry-form','.about-grid','.about-value-grid','.service-layout','.service-info',
                  '.service-form','.warranty-center','.warranty-query-card','.product-grid','.product-card'
                ];
                const leaks=[];
                for(const selector of selectors){
                  for(const el of document.querySelectorAll(selector)){
                    const style=getComputedStyle(el),r=el.getBoundingClientRect();
                    if(style.display==='none'||style.visibility==='hidden'||r.width<1||r.height<1)continue;
                    if(style.position==='fixed')continue;
                    if(r.left < -2 || r.right > innerWidth + 2){
                      leaks.push({selector,left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)});
                      if(leaks.length>=20)return leaks;
                    }
                  }
                }
                return leaks;
              });
              const title = await page.title();
              report.pages.push({ device: device.name, name, path, status, title, horizontalOverflow: overflow, majorLeaks, widths: bodyWidth });
              if(name==='tracking'&&device.name==='mobile'){
                report.interaction.trackingPage=await page.evaluate(()=>{
                  const form=document.querySelector('#track-form')?.getBoundingClientRect();
                  const button=document.querySelector('#track-form button')?.getBoundingClientRect();
                  return {formVisible:!!form&&form.width>0&&form.height>0,insideViewport:!!form&&form.left>=-1&&form.right<=innerWidth+1,buttonUsable:!!button&&button.width>120&&button.height>=44};
                });
              }
              if (name === 'home' && device.name !== 'desktop') {
                const geometry = await page.evaluate(() => {
                  const header = document.querySelector('.site-header')?.getBoundingClientRect();
                  const search = document.querySelector('.app-mobile-search')?.getBoundingClientRect();
                  const logo = document.querySelector('.header-brand-image')?.getBoundingClientRect();
                  return {
                    headerHeight: header ? Math.round(header.height) : null,
                    searchTop: search ? Math.round(search.top) : null,
                    headerBottom: header ? Math.round(header.bottom) : null,
                    headerSearchGap: header && search ? Math.round(search.top - header.bottom) : null,
                    logoHeight: logo ? Math.round(logo.height) : null,
                    logoWidth: logo ? Math.round(logo.width) : null
                  };
                });
                report.interaction[device.name + 'HomeGeometry'] = geometry;
              }
              await page.screenshot({
                path: out + '/' + name + '-' + device.name + '.png',
                fullPage: true,
                animations: 'disabled'
              });
            }

            await context.close();
          }

          // Mobile public menu: visual state, click-through, inert and focus containment.
          {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            const toggle = page.locator('.mobile-menu').first();
            await toggle.waitFor({ state: 'visible', timeout: 10000 });
            const toggleBox = await toggle.boundingBox();
            if (!toggleBox) throw new Error('Mobile menu button has no clickable box');
            await page.touchscreen.tap(toggleBox.x + toggleBox.width / 2, toggleBox.y + toggleBox.height / 2);
            await page.waitForTimeout(300);

            const menu = page.locator('.main-nav.open').first();
            const backdrop = page.locator('.site-layer-backdrop').first();
            const menuVisible = await menu.isVisible().catch(() => false);
            const backdropVisible = await backdrop.isVisible().catch(() => false);
            const mainInert = await page.locator('main').evaluate(el => el.hasAttribute('inert')).catch(() => false);
            const urlBefore = page.url();

            await page.screenshot({
              path: out + '/home-mobile-menu-open.png',
              fullPage: false,
              animations: 'disabled'
            });

            // Check focus containment before closing the menu.
            let focusEscaped = false;
            if (menuVisible) {
              for (let i=0;i<12;i++) {
                await page.keyboard.press('Tab');
                const inside = await page.evaluate(() => {
                  const nav = document.querySelector('.main-nav.open');
                  return !!nav && nav.contains(document.activeElement);
                });
                if (!inside) { focusEscaped = true; break; }
              }
            } else {
              focusEscaped = true;
            }

            // Find an actually visible point on the backdrop outside the drawer.
            const targetPoint = await page.evaluate(() => {
              const step = 12;
              for (let y = step; y < innerHeight - step; y += step) {
                for (let x = step; x < innerWidth - step; x += step) {
                  const el = document.elementFromPoint(x,y);
                  if (el?.classList?.contains('site-layer-backdrop')) return { x, y };
                }
              }
              return null;
            });

            let elementAtPoint = null;
            let urlAfter = urlBefore;
            let menuClosedAfterBackdrop = false;
            if (targetPoint) {
              elementAtPoint = await page.evaluate(({x,y}) => {
                const el = document.elementFromPoint(x,y);
                return el ? { tag: el.tagName, cls: String(el.className || ''), aria: el.getAttribute('aria-label') } : null;
              }, targetPoint);
              await page.touchscreen.tap(targetPoint.x, targetPoint.y);
              await page.waitForTimeout(450);
              urlAfter = page.url();
              menuClosedAfterBackdrop = !(await menu.isVisible().catch(() => false));
            }

            report.interaction.publicMobileMenu = {
              menuVisible,
              backdropVisible,
              mainInert,
              focusContained: !focusEscaped,
              targetPoint,
              elementAtPoint,
              urlBefore,
              urlAfter,
              clickThroughBlocked: mainInert && urlBefore === urlAfter,
              menuClosedAfterBackdrop
            };

            // Re-open from a clean home state, then validate the submenu without tapping any covered link.
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            const liveToggle = page.locator('.site-header > .header-actions > .mobile-menu:visible').first();
            await liveToggle.tap();
            const liveMenu = page.locator('.main-nav.open').first();
            await liveMenu.waitFor({state:'visible',timeout:5000});
            await page.waitForTimeout(180);
            const categoryToggle = page.locator('.main-nav.open .nav-category-toggle:visible').first();
            await categoryToggle.evaluate(el => el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
            await page.waitForTimeout(260);

            const categoryDropdown = page.locator('.main-nav.open .nav-category.open .nav-dropdown').first();
            const categoryDropdownVisible = await categoryDropdown.isVisible().catch(()=>false);
            const categoryGeometry = await page.evaluate(() => {
              const nav=document.querySelector('.main-nav.open.category-layer-open');
              const open=document.querySelector('.main-nav.open .nav-category.open');
              const dropdown=open?.querySelector('.nav-dropdown');
              if(!nav || !open || !dropdown) return {siblingPointerLocked:false,submenuInFlow:false,menuVisible:false};
              const siblings=[...nav.children].filter(el=>el.matches('a,.nav-category:not(.open)'));
              const locked=siblings.length>0 && siblings.every(el=>getComputedStyle(el).pointerEvents==='none');
              const parentBox=open.getBoundingClientRect(), dropBox=dropdown.getBoundingClientRect();
              const style=getComputedStyle(dropdown);
              return {
                siblingPointerLocked:locked,
                submenuInFlow:style.position==='static' && parentBox.bottom >= dropBox.bottom - 1,
                menuVisible:getComputedStyle(nav).display!=='none' && nav.getBoundingClientRect().height>0,
                dropdownPosition:style.position,
                parentBottom:Math.round(parentBox.bottom),
                dropdownBottom:Math.round(dropBox.bottom)
              };
            });
            const categoryUrlStayedHome = new URL(page.url()).pathname === '/';
            await page.screenshot({
              path: out + '/home-mobile-category-open.png',
              fullPage: false,
              animations: 'disabled'
            });
            report.interaction.mobileCategorySubmenu = {
              categoryDropdownVisible,
              siblingPointerLocked: categoryGeometry.siblingPointerLocked,
              submenuInFlow: categoryGeometry.submenuInFlow,
              menuVisible: categoryGeometry.menuVisible,
              dropdownPosition: categoryGeometry.dropdownPosition,
              categoryUrlStayedHome,
              parentBottom: categoryGeometry.parentBottom,
              dropdownBottom: categoryGeometry.dropdownBottom
            };
            await context.close();
          }

          // Bottom Categories must show real content on the very first tap, not only a dark backdrop.
          {
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            const categoriesButton = page.locator('[data-app-categories]:visible').first();
            await categoriesButton.tap();
            const sheet = page.locator('.app-category-sheet').first();
            await sheet.waitFor({state:'visible',timeout:5000});
            await page.waitForTimeout(350);
            const categoryLinks = await page.locator('.app-category-list a').count();
            const sheetBox = await sheet.boundingBox();
            const mobileCardGeometry = await page.evaluate(() => {
              const cards=[...document.querySelectorAll('.confidence-grid>article')].slice(0,3).map(el=>el.getBoundingClientRect());
              const products=[...document.querySelectorAll('.featured .product-card')].slice(0,2).map(el=>el.getBoundingClientRect());
              const sameRow=cards.length===3 && Math.max(...cards.map(x=>x.top))-Math.min(...cards.map(x=>x.top))<=2 && cards.every(x=>x.width>80);
              const productSameRow=products.length<2 || (Math.abs(products[0].top-products[1].top)<=2 && products.every(x=>x.width>140));
              return {sameRow,productSameRow,cardWidths:cards.map(x=>Math.round(x.width)),productWidths:products.map(x=>Math.round(x.width))};
            });
            report.interaction.firstOpenCategories={visible:await sheet.isVisible(),categoryLinks,hasUsableBox:!!sheetBox&&sheetBox.width>250&&sheetBox.height>120,...mobileCardGeometry};
            await page.screenshot({path:out+'/home-mobile-bottom-categories-first-open.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          // Product detail actions: no floating WhatsApp, no sticky overlay while the gallery/summary is visible.
          // After the product summary leaves the viewport, one compact sticky CTA may appear above the app dock.
          if (productDetailPath) {
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            const productLink = page.locator('.featured a[href^="/urun/"]:visible').first();
            if(await productLink.count()){
              await productLink.click();
              await page.waitForURL('**/urun/**',{timeout:10000});
            }else{
              await page.goto(base + productDetailPath, { waitUntil: 'domcontentloaded', timeout: 45000 });
            }
            await page.locator('.detail').first().waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(700);
            const initial = await page.evaluate(() => {
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              const floating=document.querySelector('.floating-wa');
              const sticky=document.querySelector('.detail-mobile-cta');
              const inline=document.querySelector('.detail-summary .detail-action-row');
              const trust=document.querySelector('.detail-trust-row');
              const processButton=document.querySelector('.detail-process-button');
              const stickyBox=sticky?.getBoundingClientRect(),trustBox=trust?.getBoundingClientRect();
              const overlaps=(a,b)=>!!a&&!!b&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
              return {
                floatingVisible:visible(floating),
                stickyVisible:visible(sticky),
                inlineVisible:visible(inline),
                trustVisible:visible(trust),
                processButtonVisible:visible(processButton),
                processButtonHref:processButton?.getAttribute('href')||'',
                trustCoveredBySticky:visible(sticky)&&overlaps(stickyBox,trustBox),
                homeCtaPresent:!!document.querySelector('.cta-banner'),
                pageDetailClass:document.body.classList.contains('page-detail'),
                pageHomeClass:document.body.classList.contains('page-home')
              };
            });
            await page.locator('.product-details').first().scrollIntoViewIfNeeded();
            await page.waitForTimeout(350);
            const afterSummary = await page.evaluate(() => {
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              const sticky=document.querySelector('.detail-mobile-cta');
              const dock=document.querySelector('.app-bottom-nav');
              const stickyBox=sticky?.getBoundingClientRect(),dockBox=dock?.getBoundingClientRect();
              return {stickyVisible:visible(sticky),stickyAboveDock:!!stickyBox&&!!dockBox&&stickyBox.bottom<=dockBox.top+2};
            });
            report.interaction.productDetail={initial,afterSummary};
            await page.screenshot({path:out+'/product-detail-mobile-sticky-cta.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          // Tablet product detail uses the in-flow actions only; no duplicated phone sticky bar.
          if (productDetailPath) {
            const context = await browser.newContext({viewport:{width:820,height:1180},deviceScaleFactor:1,hasTouch:true});
            const page = await context.newPage();
            await page.goto(base + productDetailPath, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('.detail-summary').first().waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(500);
            const tabletProductDetail = await page.evaluate(() => {
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              return {
                stickyVisible:visible(document.querySelector('.detail-mobile-cta')),
                inlineVisible:visible(document.querySelector('.detail-summary .detail-action-row')),
                trustVisible:visible(document.querySelector('.detail-trust-row'))
              };
            });
            report.interaction.tabletProductDetail=tabletProductDetail;
            await page.screenshot({path:out+'/product-detail-tablet-actions.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          // Real image-rich product: gallery and three trust cards must stay centered inside their own containers.
          if (imageProductPath) {
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            await page.goto(base + imageProductPath, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('.detail-photo').first().waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(700);
            const geometry = await page.evaluate(() => {
              const rect=el=>el?.getBoundingClientRect?.()||null;
              const inside=(child,parent,t=2)=>!!child&&!!parent&&child.left>=parent.left-t&&child.right<=parent.right+t;
              const gallery=rect(document.querySelector('.product-gallery'));
              const photo=rect(document.querySelector('.detail-photo'));
              const image=rect(document.querySelector('.detail-photo>img'));
              const summary=rect(document.querySelector('.detail-summary'));
              const trust=rect(document.querySelector('.detail-trust-row'));
              const cards=[...document.querySelectorAll('.detail-trust-row>*')].map(rect).filter(Boolean);
              const thumbnails=rect(document.querySelector('.thumbnails'));
              return {
                path:location.pathname,
                galleryInsideViewport:!!gallery&&gallery.left>=-1&&gallery.right<=innerWidth+1,
                photoInsideGallery:inside(photo,gallery),
                imageInsidePhoto:inside(image,photo),
                imageCentered:!!image&&!!photo&&Math.abs((image.left+image.right)/2-(photo.left+photo.right)/2)<=2,
                summaryInsideViewport:!!summary&&summary.left>=-1&&summary.right<=innerWidth+1,
                trustInsideSummary:inside(trust,summary),
                trustCardsInside:cards.length===3&&cards.every(card=>inside(card,trust,1)),
                stickyHiddenWhileSummaryVisible:!document.querySelector('.detail-mobile-cta') || getComputedStyle(document.querySelector('.detail-mobile-cta')).display==='none',
                thumbnailsInsideGallery:!thumbnails||inside(thumbnails,gallery),
                cardCount:cards.length,
                galleryWidth:gallery?Math.round(gallery.width):0,
                photoWidth:photo?Math.round(photo.width):0,
                imageWidth:image?Math.round(image.width):0,
                trustWidth:trust?Math.round(trust.width):0,
                cardWidths:cards.map(x=>Math.round(x.width))
              };
            });
            report.interaction.imageProductGeometry=geometry;
            await page.screenshot({path:out+'/product-detail-images-mobile-geometry.png',fullPage:true,animations:'disabled'});
            await context.close();
          }

          // Desktop product gallery uses one centered image plus thumbnails.
          // Obsolete previous/next absolute controls must not remain visible.
          if (imageProductPath) {
            const context = await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const page = await context.newPage();
            await page.goto(base + imageProductPath, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('.detail-photo').first().waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(450);
            const desktopGallery = await page.evaluate(() => {
              const stage=document.querySelector('.gallery-stage')?.getBoundingClientRect();
              const image=document.querySelector('.gallery-stage>img')?.getBoundingClientRect();
              const rail=document.querySelector('.thumbnails')?.getBoundingClientRect();
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              const arrows=[...document.querySelectorAll('.gallery-stage .gallery-arrow')].filter(visible);
              const center=r=>(r.left+r.right)/2;
              return {
                present:!!stage&&!!image,
                imageCentered:!!stage&&!!image&&Math.abs(center(stage)-center(image))<=2,
                stageRatio:stage?Number((stage.width/stage.height).toFixed(3)):0,
                thumbnailsInside:!rail||!!stage&&(rail.left>=stage.left-2&&rail.right<=stage.right+2),
                visibleArrowCount:arrows.length
              };
            });
            report.interaction.desktopGallery=desktopGallery;
            await page.screenshot({path:out+'/product-detail-images-desktop-gallery.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          // Tablet drawer and click-to-open category behavior, isolated from the phone test.
          {
            const context = await browser.newContext({
              viewport: { width: 820, height: 1180 },
              deviceScaleFactor: 1,
              hasTouch: true
            });
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            await page.locator('.site-header > .header-actions > .mobile-menu:visible').first().tap();
            const sheet = page.locator('.main-nav.open').first();
            await sheet.waitFor({state:'visible',timeout:5000});
            const categoryToggle = page.locator('.main-nav.open .nav-category-toggle:visible').first();
            await categoryToggle.evaluate(el => el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerType:'touch'})));
            await page.waitForTimeout(220);
            const categoryDropdownVisible = await page.locator('.main-nav.open .nav-category.open .nav-dropdown').first().isVisible().catch(()=>false);
            const tabletState = await page.evaluate(() => {
              const sheet=document.querySelector('.main-nav.open');
              const open=document.querySelector('.main-nav.open .nav-category.open');
              const dropdown=open?.querySelector('.nav-dropdown');
              if(!sheet) return {visible:false,background:'',borderRadius:'',submenuInFlow:false,urlStayedHome:false};
              const sheetStyle=getComputedStyle(sheet);
              const openBox=open?.getBoundingClientRect(), dropBox=dropdown?.getBoundingClientRect();
              return {
                visible:sheetStyle.display!=='none' && sheet.getBoundingClientRect().height>0,
                background:sheetStyle.backgroundColor,
                borderRadius:sheetStyle.borderTopLeftRadius,
                submenuInFlow:!!open && !!dropdown && getComputedStyle(dropdown).position==='static' && !!openBox && !!dropBox && openBox.bottom >= dropBox.bottom - 1,
                urlStayedHome:location.pathname==='/'
              };
            });
            report.interaction.tabletMenu = {
              ...tabletState,
              categoryDropdownVisible
            };
            await page.screenshot({path:out+'/home-tablet-menu-open.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          // Contact and service request forms must require e-mail and phone.
          {
            const context = await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page = await context.newPage();
            await page.goto(base + '/iletisim', { waitUntil: 'networkidle', timeout: 45000 });
            const contact = await page.evaluate(() => {
              const email=document.querySelector('.inquiry-form input[name="email"]'),phone=document.querySelector('.inquiry-form input[name="phone"]');
              return {emailRequired:!!email?.required,emailType:email?.getAttribute('type'),emailPattern:email?.getAttribute('pattern')||'',phoneRequired:!!phone?.required,phonePattern:phone?.getAttribute('pattern')||''};
            });
            await page.goto(base + '/servis-talebi', { waitUntil: 'networkidle', timeout: 45000 });
            const service = await page.evaluate(() => {
              const email=document.querySelector('#service-request-form input[name="email"]'),phone=document.querySelector('#service-request-form input[name="phone"]');
              return {emailRequired:!!email?.required,emailType:email?.getAttribute('type'),emailPattern:email?.getAttribute('pattern')||'',phoneRequired:!!phone?.required,phonePattern:phone?.getAttribute('pattern')||''};
            });
            report.interaction.requiredContacts={contact,service};
            await context.close();
          }

          // Desktop categories must open automatically on hover.
          {
            const context = await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            const page = await context.newPage();
            await page.goto(base + '/', { waitUntil: 'networkidle', timeout: 45000 });
            const firstCategory = page.locator('.main-nav .nav-category').first();
            await firstCategory.hover();
            await page.waitForTimeout(240);
            const dropdown = firstCategory.locator('.nav-dropdown').first();
            const hoverDropdownVisible = await dropdown.isVisible().catch(()=>false);
            report.interaction.desktopCategoryHover = { hoverDropdownVisible };
            await page.screenshot({path:out+'/home-desktop-category-hover.png',fullPage:false,animations:'disabled'});
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(out + '/report.json', JSON.stringify(report, null, 2));

          const failedPages = report.pages.filter(p => p.status !== 200 || p.horizontalOverflow || (p.majorLeaks?.length || 0) > 0);
          const m = report.interaction.publicMobileMenu;
          const cat = report.interaction.mobileCategorySubmenu;
          const mobileGeometry = report.interaction.mobileHomeGeometry || {};
          const tabletGeometry = report.interaction.tabletHomeGeometry || {};
          const tabletMenu = report.interaction.tabletMenu || {};
          const desktopHover = report.interaction.desktopCategoryHover || {};
          const requiredContacts = report.interaction.requiredContacts || {};
          const firstOpenCategories = report.interaction.firstOpenCategories || {};
          const productDetail = report.interaction.productDetail || {};
          const tabletProductDetail = report.interaction.tabletProductDetail || {};
          const imageProductGeometry = report.interaction.imageProductGeometry || {};
          const desktopGallery = report.interaction.desktopGallery || {};
          const trackingPage = report.interaction.trackingPage || {};
          const desktopGalleryOk = !imageProductPath || (
            desktopGallery.present &&
            desktopGallery.imageCentered &&
            desktopGallery.stageRatio >= 1.3 &&
            desktopGallery.thumbnailsInside &&
            Number(desktopGallery.visibleArrowCount) === 0
          );
          const imageProductOk = !imageProductPath || (
            imageProductGeometry.galleryInsideViewport &&
            imageProductGeometry.photoInsideGallery &&
            imageProductGeometry.imageInsidePhoto &&
            imageProductGeometry.imageCentered &&
            imageProductGeometry.summaryInsideViewport &&
            imageProductGeometry.trustInsideSummary &&
            imageProductGeometry.trustCardsInside &&
            imageProductGeometry.stickyHiddenWhileSummaryVisible &&
            imageProductGeometry.thumbnailsInsideGallery
          );
          const firstOpenCategoriesOk = firstOpenCategories.visible && firstOpenCategories.categoryLinks > 0 && firstOpenCategories.hasUsableBox && firstOpenCategories.sameRow && firstOpenCategories.productSameRow;
          const productDetailOk = !productDetailPath || (
            !productDetail.initial?.floatingVisible &&
            !productDetail.initial?.stickyVisible &&
            productDetail.initial?.inlineVisible &&
            productDetail.initial?.trustVisible &&
            productDetail.initial?.processButtonVisible &&
            productDetail.initial?.processButtonHref === '/talep-takip' &&
            !productDetail.initial?.trustCoveredBySticky &&
            !productDetail.initial?.homeCtaPresent &&
            productDetail.initial?.pageDetailClass &&
            !productDetail.initial?.pageHomeClass &&
            (!productDetail.afterSummary?.stickyVisible || productDetail.afterSummary?.stickyAboveDock) &&
            !tabletProductDetail?.stickyVisible &&
            tabletProductDetail?.inlineVisible &&
            tabletProductDetail?.trustVisible
          );
          const requiredContactsOk = requiredContacts.contact?.emailRequired && requiredContacts.contact?.emailType === 'email' && !requiredContacts.contact?.emailPattern && requiredContacts.contact?.phoneRequired && requiredContacts.service?.emailRequired && requiredContacts.service?.emailType === 'email' && !requiredContacts.service?.emailPattern && requiredContacts.service?.phoneRequired;
          const geometryOk =
            Number(mobileGeometry.headerSearchGap) <= 2 &&
            Number(tabletGeometry.headerSearchGap) <= 2 &&
            Number(mobileGeometry.headerHeight) <= 54 &&
            Number(tabletGeometry.headerHeight) <= 58 &&
            Number(mobileGeometry.logoHeight) >= 40 &&
            Number(tabletGeometry.logoHeight) >= 42;
          const interactionOk =
            m.menuVisible && m.backdropVisible && m.mainInert && m.clickThroughBlocked && m.focusContained && m.menuClosedAfterBackdrop &&
            cat?.categoryDropdownVisible && cat?.siblingPointerLocked && cat?.submenuInFlow && cat?.menuVisible && cat?.categoryUrlStayedHome &&
            tabletMenu?.visible && tabletMenu?.categoryDropdownVisible && tabletMenu?.submenuInFlow && tabletMenu?.urlStayedHome &&
            tabletMenu?.background === 'rgb(255, 255, 255)' &&
            desktopHover?.hoverDropdownVisible && geometryOk && requiredContactsOk && firstOpenCategoriesOk && productDetailOk && imageProductOk && desktopGalleryOk &&
            trackingPage.formVisible && trackingPage.insideViewport && trackingPage.buttonUsable;
          console.log(JSON.stringify(report, null, 2));

          if (failedPages.length || !interactionOk) {
            console.error('Live visual audit failed', { failedPages, interaction: m, categorySubmenu: cat, mobileGeometry, tabletGeometry, tabletMenu, desktopHover, geometryOk });
            process.exit(1);
          }
          EOF
          node audit.mjs

      - name: Build isolated authenticated audit app
        run: dotnet build INOKSKAR.sln -c Release

      - name: Start isolated authenticated admin audit app
        run: |
          set -euo pipefail
          rm -rf /tmp/inokskar-admin-audit-data
          mkdir -p /tmp/inokskar-admin-audit-data
          AUDIT_PASSWORD='UiAudit-2026-safe'
          AUDIT_HASH="$(python - <<'PY'
          import os,hashlib,base64
          password=b'UiAudit-2026-safe'
          salt=b'INOKSKAR-UI-AUD'
          value=hashlib.pbkdf2_hmac('sha256',password,salt,210000,dklen=32)
          print('210000:'+base64.b64encode(salt).decode()+':'+base64.b64encode(value).decode())
          PY
          )"
          ASPNETCORE_ENVIRONMENT=Production \
          RAILWAY_ENVIRONMENT=ci \
          Storage__Path=/tmp/inokskar-admin-audit-data \
          Site__PublicBaseUrl=http://127.0.0.1:5101 \
          Admin__Email=ui-audit@invalid.local \
          Admin__PasswordHash="$AUDIT_HASH" \
          dotnet run --project IndustrialCatalog/IndustrialCatalog.csproj -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5101 > /tmp/inokskar-admin-audit.log 2>&1 &
          echo $! > /tmp/inokskar-admin-audit.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5101/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/inokskar-admin-audit.log
          exit 1

      - name: Run authenticated admin and customer Chromium audit
        run: |
          cd /tmp/inokskar-live-audit
          cat > admin-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:5101';
          const out=process.env.GITHUB_WORKSPACE+'/live-visual-audit/authenticated';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={pages:[],dialog:{},drawer:{},customer:[],productEditor:{},workflow:{}};
          const devices=[
            {name:'desktop',width:1440,height:1000,isMobile:false},
            {name:'tablet',width:820,height:1180,isMobile:false},
            {name:'mobile',width:390,height:844,isMobile:true}
          ];
          const adminTabs=['Genel bakış','Ürünler','Kategoriler','Fiyat yönetimi','Site ayarları','Güvenlik','İstatistikler','Geçmiş & yedek','Müşteri talepleri'];
          const privatePages=[
            ['warranties','/admin/warranties'],
            ['warranty-list','/admin/warranties/list'],
            ['technical','/teknik'],
            ['users','/admin/users'],
            ['system','/admin/system'],
            ['mail','/admin/mail'],
            ['header-brand','/admin/header-brand'],
            ['account-security','/account/security']
          ];
          const selectors=[
            '.admin-main','.admin-header','.admin-box','.admin-toolbar','.metrics','.settings-grid','.table-box',
            '.warranty-admin-wrap','.warranty-admin-form-card','.warranty-list-card','.tech-wrap','.tech-panel',
            '.access-wrap','.access-card','.mail-wrap','.mail-card','.brand-admin-main','.brand-admin-card',
            '.inquiry-wrap','.inquiry-card'
          ];

          const layout=async page=>{
            return await page.evaluate((selectors)=>{
              const leaks=[];
              for(const selector of selectors){
                for(const el of document.querySelectorAll(selector)){
                  const style=getComputedStyle(el),r=el.getBoundingClientRect();
                  if(style.display==='none'||style.visibility==='hidden'||r.width<1||r.height<1)continue;
                  if(style.position==='fixed')continue;
                  if(r.left<-2||r.right>innerWidth+2){
                    leaks.push({selector,left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)});
                    if(leaks.length>=20)return leaks;
                  }
                }
              }
              return leaks;
            },selectors);
          };

          async function login(context){
            const page=await context.newPage();
            await page.goto(base+'/login',{waitUntil:'networkidle'});
            await page.locator('input[name="email"]').fill('ui-audit@invalid.local');
            await page.locator('input[name="password"]').fill('UiAudit-2026-safe');
            await Promise.all([
              page.waitForURL(url=>!url.pathname.endsWith('/login'),{timeout:10000}),
              page.locator('button[type="submit"]').click()
            ]);
            await page.close();
          }

          // Seed one support request so inquiries and delete confirmation are visible.
          {
            const context=await browser.newContext();
            await context.request.post(base+'/api/inquiry',{
              headers:{Origin:base},
              data:{name:'UI Audit Talebi',email:'ui.audit.request@example.com',phone:'+90 555 111 22 33',purpose:'teklif',message:'Görsel denetim talebi'}
            });
            await context.request.post(base+'/api/service-request',{
              headers:{Origin:base},
              data:{name:'UI Audit Servis',email:'ui.audit.service@example.com',phone:'+90 555 222 33 44',businessName:'UI Audit İşletme',address:'İstanbul test servis adresi',productName:'Test cihazı',productCode:'TEST-001',serialNumber:'SER-AUDIT-001',message:'Servis detayı görsel denetimi'}
            });
            await context.close();
          }

          // Seed one real warranty with the isolated superadmin and resolve all dynamic detail routes.
          let supportInquiryPath='',serviceInquiryPath='',technicalDevicePath='',certificatePath='';
          {
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            await login(context);
            const page=await context.newPage();
            await page.goto(base+'/admin',{waitUntil:'networkidle'});
            const seed=await page.evaluate(async()=>{
              const catalog=await fetch('/api/catalog?admin=1',{cache:'no-store'}).then(r=>r.json());
              const inquiries=Array.isArray(catalog?.inquiries)?catalog.inquiries:[];
              const parsed=inquiries.map(row=>{let data={};try{data=JSON.parse(row.data||'{}')}catch{}return {id:row.id,data};});
              const support=parsed.find(x=>x.data?.type==='support');
              const service=parsed.find(x=>x.data?.type==='service');
              const wp=await fetch('/api/warranty-products',{cache:'no-store'}).then(r=>r.json());
              const product=wp?.products?.[0];
              let warrantyId='';
              if(product){
                const payload={
                  productId:product.id,
                  productCode:product.code||product.id,
                  businessName:'UI Audit İşletme',
                  invoiceNumber:'UI-2026-001',
                  deliveryDocumentNumber:'UI-TESLIM-001',
                  warrantyNote:'Dinamik sayfa görsel denetim kaydı',
                  serialNumber:'UI-AUDIT-SERIAL-001',
                  deliveryDate:'2026-10-01',
                  warrantyMonths:24,
                  verificationCode:'AUDIT-2026',
                  components:[{name:'Ana gövde',covered:true,months:24,note:'Test kapsamı'}]
                };
                const saved=await fetch('/api/warranties',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(async r=>({ok:r.ok,body:await r.json()}));
                if(saved.ok)warrantyId=saved.body?.record?.id||'';
              }
              return {supportId:support?.id||'',serviceId:service?.id||'',warrantyId};
            });
            supportInquiryPath=seed.supportId?'/admin/inquiries/'+encodeURIComponent(seed.supportId):'';
            serviceInquiryPath=seed.serviceId?'/admin/inquiries/'+encodeURIComponent(seed.serviceId):'';
            technicalDevicePath=seed.warrantyId?'/teknik/cihaz/'+encodeURIComponent(seed.warrantyId):'';
            certificatePath=seed.warrantyId?'/admin/warranties/'+encodeURIComponent(seed.warrantyId)+'/certificate':'';
            await context.close();
          }

          for(const device of devices){
            const context=await browser.newContext({viewport:{width:device.width,height:device.height},deviceScaleFactor:1,isMobile:device.isMobile,hasTouch:device.name!=='desktop'});
            await login(context);
            const page=await context.newPage();
            await page.goto(base+'/admin',{waitUntil:'networkidle',timeout:30000});
            await page.locator('.admin-main').waitFor({state:'visible',timeout:10000});

            for(const label of adminTabs){
              const navButton=page.locator('.admin-sidebar nav button').filter({hasText:label}).first();
              if(await navButton.count()) await navButton.evaluate(el=>el.click());
              await page.waitForTimeout(250);
              const uiPage=await page.evaluate(()=>document.body.dataset.uiPage||'admin');
              const leaks=await layout(page);
              report.pages.push({device:device.name,name:'admin-'+label,path:page.url(),uiPage,leaks});
              await page.screenshot({path:out+'/admin-'+label.replace(/[^a-zA-Z0-9ğüşöçıİĞÜŞÖÇ]+/g,'-')+'-'+device.name+'.png',fullPage:true,animations:'disabled'});
            }

            // Mobile/tablet drawer must open without freezing the main page.
            if(device.name!=='desktop'){
              await page.goto(base+'/admin',{waitUntil:'networkidle'});
              const toggle=page.locator('.admin-mobile-toggle').first();
              if(await toggle.isVisible()){
                await toggle.tap();
                await page.waitForTimeout(200);
                const drawer=await page.evaluate(()=>{
                  const side=document.querySelector('.admin-sidebar'),nav=document.querySelector('.admin-sidebar nav'),main=document.querySelector('.admin-main');
                  return {open:side?.classList.contains('menu-open')||false,navVisible:!!nav&&getComputedStyle(nav).display!=='none'&&nav.getBoundingClientRect().height>0,mainInert:main?.hasAttribute('inert')||false};
                });
                report.drawer[device.name]=drawer;
                await page.screenshot({path:out+'/admin-drawer-'+device.name+'.png',fullPage:false,animations:'disabled'});
                await page.locator('.admin-menu-sheet-close').first().tap().catch(()=>{});
              }
            }

            // Product add/edit must be a true mobile workspace, not a shifted half-width sheet.
            if(device.name==='mobile'){
              await page.goto(base+'/admin',{waitUntil:'networkidle'});
              const productsNav=page.locator('.admin-sidebar nav button').filter({hasText:'Ürünler'}).first();
              await productsNav.evaluate(el=>el.click());
              await page.waitForTimeout(250);
              await page.getByRole('button',{name:'Ürün ekle'}).click();
              const editor=page.locator('.product-editor-dialog').first();
              await editor.waitFor({state:'visible',timeout:5000});
              const box=await editor.boundingBox();
              const productName=editor.locator('input').first();
              await productName.focus();
              report.productEditor={
                visible:await editor.isVisible(),
                box,
                fullWidth:!!box&&box.x>=-1&&box.x+box.width<=device.width+1&&box.width>=device.width-2,
                insideViewport:!!box&&box.y>=-1&&box.y+box.height<=device.height+1,
                inputFontSize:await productName.evaluate(el=>getComputedStyle(el).fontSize),
                closeBox:await editor.locator('[data-slot="dialog-close"]').boundingBox(),
                saveBox:await editor.getByRole('button',{name:/Ürünü kaydet ve yayınla/}).boundingBox()
              };
              await page.screenshot({path:out+'/admin-product-editor-mobile.png',fullPage:false,animations:'disabled'});
              await editor.locator('[data-slot="dialog-close"]').click();
            }

            // Request workflow dialog must save a customer-visible response that the phone tracker can read.
            if(device.name==='mobile'){
              await page.goto(base+'/admin',{waitUntil:'networkidle'});
              const inquiriesNav=page.locator('.admin-sidebar nav button').filter({hasText:'Müşteri talepleri'}).first();
              await inquiriesNav.evaluate(el=>el.click());
              await page.waitForTimeout(300);
              const supportCard=page.locator('.inquiry-admin-card').filter({hasText:'Destek Talebi'}).first();
              const manage=supportCard.locator('.workflow-manage-btn').first();
              if(await manage.count()){
                await manage.click();
                const workflow=page.locator('.workflow-editor-dialog').first();
                await workflow.waitFor({state:'visible',timeout:5000});
                const wbox=await workflow.boundingBox();
                const trigger=workflow.locator('[data-slot="select-trigger"]').first();
                await trigger.click();
                await page.getByRole('option',{name:'Arandı'}).click();
                await workflow.getByRole('button',{name:'Arandı'}).click();
                await workflow.getByRole('button',{name:'Süreci kaydet'}).click();
                await workflow.waitFor({state:'hidden',timeout:10000});
                const tracked=await context.request.post(base+'/api/inquiry/track',{headers:{Origin:base},data:{phone:'+90 555 111 22 33'}});
                const trackingBody=await tracked.json();
                const matching=(trackingBody.records||[]).find(x=>x.requestCode);
                report.workflow={
                  dialogInside:!!wbox&&wbox.x>=0&&wbox.x+wbox.width<=device.width+1&&wbox.y>=0&&wbox.y+wbox.height<=device.height+1,
                  persistedStatus:matching?.status||'',
                  persistedReply:matching?.publicReply||''
                };
                await page.screenshot({path:out+'/admin-inquiry-workflow-mobile.png',fullPage:false,animations:'disabled'});
              }
            }

            // Delete confirmation geometry on phone reproduces the user's reported case.
            if(device.name==='mobile'){
              await page.goto(base+'/admin?tab=inquiries',{waitUntil:'networkidle'});
              const del=page.locator('[data-r95-inquiry-delete="source"]').first();
              if(await del.count()){
                await del.tap();
                const dialog=page.locator('[data-slot="alert-dialog-content"]').first();
                await dialog.waitFor({state:'visible',timeout:5000});
                const box=await dialog.boundingBox();
                report.dialog={
                  visible:await dialog.isVisible(),
                  box,
                  insideViewport:!!box&&box.x>=0&&box.x+box.width<=device.width+1&&box.y>=0&&box.y+box.height<=device.height+1
                };
                await page.screenshot({path:out+'/admin-inquiry-delete-dialog-mobile.png',fullPage:false,animations:'disabled'});
                await page.locator('[data-slot="alert-dialog-cancel"]').first().tap();
              }
            }

            const devicePrivatePages=[
              ...privatePages,
              ...(supportInquiryPath?[['inquiry-detail-support',supportInquiryPath]]:[]),
              ...(serviceInquiryPath?[['inquiry-detail-service',serviceInquiryPath]]:[]),
              ...(technicalDevicePath?[['technical-device',technicalDevicePath]]:[]),
              ...(certificatePath?[['warranty-certificate',certificatePath]]:[])
            ];
            for(const [name,path] of devicePrivatePages){
              const response=await page.goto(base+path,{waitUntil:'networkidle',timeout:30000});
              await page.waitForTimeout(250);
              const leaks=await layout(page);
              report.pages.push({device:device.name,name,path,status:response?.status()||0,uiPage:await page.evaluate(()=>document.body.dataset.uiPage||''),leaks});
              await page.screenshot({path:out+'/'+name+'-'+device.name+'.png',fullPage:true,animations:'disabled'});
            }
            await context.close();
          }

          // Customer signed-in pages.
          for(const device of devices){
            const context=await browser.newContext({viewport:{width:device.width,height:device.height},deviceScaleFactor:1,isMobile:device.isMobile,hasTouch:device.name!=='desktop'});
            const page=await context.newPage();
            await page.goto(base+'/kayit',{waitUntil:'networkidle'});
            const suffix=device.name+'-'+Date.now();
            await page.locator('input[name="name"]').fill('UI Audit Müşteri');
            await page.locator('input[name="email"]').fill('ui-audit-'+suffix+'@example.com');
            await page.locator('input[name="password"]').fill('Customer-2026-safe');
            await page.locator('input[name="confirm"]').fill('Customer-2026-safe');
            await Promise.all([
              page.waitForURL('**/hesabim/profil',{timeout:10000}),
              page.locator('button[type="submit"]').click()
            ]);
            for(const [name,path] of [['customer-profile','/hesabim/profil'],['customer-security','/account/security']]){
              const response=await page.goto(base+path,{waitUntil:'networkidle'});
              await page.waitForTimeout(250);
              const leaks=await layout(page);
              report.customer.push({device:device.name,name,path,status:response?.status()||0,leaks});
              await page.screenshot({path:out+'/'+name+'-'+device.name+'.png',fullPage:true,animations:'disabled'});
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2));
          const failed=[
            ...report.pages.filter(x=>(x.status&&x.status!==200)||(x.leaks?.length||0)>0),
            ...report.customer.filter(x=>x.status!==200||(x.leaks?.length||0)>0)
          ];
          const drawersOk=['mobile','tablet'].every(k=>report.drawer[k]?.open&&report.drawer[k]?.navVisible&&report.drawer[k]?.mainInert);
          const dynamicRoutesOk=!!supportInquiryPath&&!!serviceInquiryPath&&!!technicalDevicePath&&!!certificatePath;
          const productEditorOk=report.productEditor.visible&&report.productEditor.fullWidth&&report.productEditor.insideViewport&&report.productEditor.inputFontSize==='16px'&&
            report.productEditor.closeBox?.y<70&&report.productEditor.closeBox?.x>320&&
            report.productEditor.saveBox?.y>700&&report.productEditor.saveBox?.y+report.productEditor.saveBox?.height<=845;
          const workflowOk=report.workflow.dialogInside&&report.workflow.persistedStatus==='contacted'&&String(report.workflow.persistedReply||'').length>10;
          if(failed.length||!report.dialog.insideViewport||!drawersOk||!dynamicRoutesOk||!productEditorOk||!workflowOk){
            console.error(JSON.stringify({failed,dialog:report.dialog,drawer:report.drawer,productEditor:report.productEditor,workflow:report.workflow},null,2));
            process.exit(1);
          }
          EOF
          node admin-audit.mjs

      - name: Stop isolated admin audit app
        if: always()
        run: |
          if [ -f /tmp/inokskar-admin-audit.pid ]; then
            kill "$(cat /tmp/inokskar-admin-audit.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/inokskar-admin-audit.log ]; then
            tail -n 80 /tmp/inokskar-admin-audit.log || true
          fi

      - name: Upload live visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INOKSKAR-Live-Visual-Audit
          path: live-visual-audit
          if-no-files-found: error
          retention-days: 14
