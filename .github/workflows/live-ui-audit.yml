name: Live UI Release Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Wait for exact Railway deployment
        run: |
          expected="$GITHUB_SHA"
          for i in {1..60}; do
            info=$(curl -fsS "https://inokskar-web-preview.up.railway.app/build-info" 2>/dev/null || true)
            actual=$(printf '%s' "$info" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$actual" = "$expected" ]; then
              echo "Exact commit is live: $actual"
              curl -fsS "https://inokskar-web-preview.up.railway.app/healthz"
              sleep 10
              exit 0
            fi
            echo "Waiting for Railway commit. Expected=$expected Current=${actual:-unavailable}"
            sleep 5
          done
          exit 1
      - name: Verify product editor and storefront logo in browser
        env:
          QA_BASE_URL: https://inokskar-web-preview.up.railway.app
        run: node .github/qa/product-ui-audit.mjs
      - name: Audit live site at 3 viewports
        env:
          QA_BASE_URL: https://inokskar-web-preview.up.railway.app
          QA_OUTPUT: qa-output
        run: node .github/qa/live-ui-audit.mjs
      - name: Print report
        if: always()
        run: |
          cat qa-output/REPORT.md || true
          node -e "const fs=require('fs');if(fs.existsSync('qa-output/report.json')){const r=JSON.parse(fs.readFileSync('qa-output/report.json'));console.log('SUMMARY',JSON.stringify(r.summary,null,2))}" || true
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-audit
          path: qa-output
          if-no-files-found: warn
          retention-days: 7
