name: Build and HTTP Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Production
      RAILWAY_ENVIRONMENT: ci
      Storage__Path: /tmp/inokskar-ci-data
      Site__PublicBaseUrl: http://127.0.0.1:5099

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build frontend
        run: |
          cd IndustrialCatalog/ClientApp
          npm install --no-audit --no-fund
          npm run build
          npx tsc --noEmit

      - name: Static release guards
        run: |
          set -euo pipefail
          if grep -R -n --include='*.css' --include='*.js' --include='*.ts' --include='*.tsx' --include='*.cs' '!important' IndustrialCatalog/ClientApp/src IndustrialCatalog/ClientApp/public IndustrialCatalog/*.cs; then
            echo "Forbidden !important usage detected."
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.ts' --include='*.tsx' -E '(^|[^a-zA-Z])(debugger|console\.log)\b' IndustrialCatalog/ClientApp/src IndustrialCatalog/ClientApp/public; then
            echo "Debug statement detected."
            exit 1
          fi

      - name: Build solution
        run: dotnet build INOKSKAR.sln -c Release

      - name: Start application
        run: |
          dotnet run --project IndustrialCatalog/IndustrialCatalog.csproj -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5099 > /tmp/inokskar.log 2>&1 &
          echo $! > /tmp/inokskar.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5099/healthz > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/inokskar.log
          exit 1

      - name: Verify public routes
        run: |
          set -euo pipefail
          check_200() {
            local path="$1"
            local code
            code="$(curl --silent --show-error --output /tmp/response --write-out '%{http_code}' "http://127.0.0.1:5099$path")"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $path, got $code"
              cat /tmp/response
              exit 1
            fi
          }
          check_200 "/"
          check_200 "/urunler"
          check_200 "/login"
          check_200 "/kayit"
          check_200 "/forgot-password"
          check_200 "/garanti-sorgulama"
          check_200 "/servis-talebi"
          check_200 "/talep-sorgula"
          check_200 "/iletisim"
          check_200 "/hakkimizda"
          check_200 "/gizlilik"
          check_200 "/kvkk"
          check_200 "/cerez"
          check_200 "/robots.txt"
          check_200 "/sitemap.xml"
          check_200 "/api/catalog"

      - name: Verify access boundaries
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/admin --write-out '%{http_code}' http://127.0.0.1:5099/admin)"
          test "$code" = "302" || { echo "Expected /admin to redirect unauthenticated users, got $code"; cat /tmp/admin; exit 1; }

          code="$(curl --silent --show-error --output /tmp/admin-api --write-out '%{http_code}' 'http://127.0.0.1:5099/api/catalog?admin=1')"
          test "$code" = "401" || { echo "Expected admin catalog API to return 401, got $code"; cat /tmp/admin-api; exit 1; }

          code="$(curl --silent --show-error --output /tmp/warranty-admin --write-out '%{http_code}' http://127.0.0.1:5099/admin/warranties)"
          test "$code" = "302" || { echo "Expected /admin/warranties to redirect unauthenticated users, got $code"; cat /tmp/warranty-admin; exit 1; }

          code="$(curl --silent --show-error --output /tmp/technical-admin --write-out '%{http_code}' http://127.0.0.1:5099/teknik)"
          test "$code" = "302" || { echo "Expected /teknik to redirect unauthenticated users, got $code"; cat /tmp/technical-admin; exit 1; }

          code="$(curl --silent --show-error --output /tmp/technical-service-api --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d '{"message":"test"}' http://127.0.0.1:5099/api/technical/device/test/services)"
          { [ "$code" = "401" ] || [ "$code" = "403" ]; } || { echo "Expected technical service creation API to reject unauthenticated/invalid-origin request with 401 or 403, got $code"; cat /tmp/technical-service-api; exit 1; }

      - name: Validate required request contacts
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/inquiry-invalid --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d '{"name":"Test Kullanıcı","email":"test@example.com","phone":"abc","message":"Test talebi"}' http://127.0.0.1:5099/api/inquiry)"
          test "$code" = "400" || { echo "Expected invalid inquiry phone to return 400, got $code"; cat /tmp/inquiry-invalid; exit 1; }
          code="$(curl --silent --show-error --output /tmp/service-invalid --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d '{"name":"Test Kullanıcı","email":"eksik-adres","phone":"+90 555 555 55 55","businessName":"Test Firma","address":"Test adresi 123","message":"Test servis talebi"}' http://127.0.0.1:5099/api/service-request)"
          test "$code" = "400" || { echo "Expected invalid service email to return 400, got $code"; cat /tmp/service-invalid; exit 1; }

          code="$(curl --silent --show-error --output /tmp/inquiry-valid --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d '{"name":"QA Kullanıcı","email":"qa.personal@gmail.com","phone":"0542 000 00 01","message":"Yayın öncesi doğrulama talebi"}' http://127.0.0.1:5099/api/inquiry)"
          test "$code" = "200" || { echo "Expected personal Gmail inquiry to return 200, got $code"; cat /tmp/inquiry-valid; exit 1; }
          for phone in '5420000001' '05420000001' '+905420000001'; do
            code="$(curl --silent --show-error --output /tmp/inquiry-status --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d "{\"phone\":\"$phone\"}" http://127.0.0.1:5099/api/inquiry-status)"
            test "$code" = "200" || { echo "Expected inquiry status lookup for $phone to return 200, got $code"; cat /tmp/inquiry-status; exit 1; }
            grep -Eq '"count":[1-9][0-9]*' /tmp/inquiry-status || { echo "Expected inquiry lookup match for $phone"; cat /tmp/inquiry-status; exit 1; }
          done
          code="$(curl --silent --show-error --output /tmp/service-valid --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:5099' -d '{"name":"QA Kullanıcı","email":"qa.personal@gmail.com","phone":"+90 542 000 00 02","businessName":"QA İşletme","address":"QA adresi 123 İstanbul","message":"Yayın öncesi servis doğrulama talebi"}' http://127.0.0.1:5099/api/service-request)"
          test "$code" = "200" || { echo "Expected personal Gmail service request to return 200, got $code"; cat /tmp/service-valid; exit 1; }

      - name: Verify production security headers
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/headers --output /dev/null http://127.0.0.1:5099/
          grep -qi '^Content-Security-Policy:' /tmp/headers
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/headers
          grep -qi '^Referrer-Policy: strict-origin-when-cross-origin' /tmp/headers
          grep -qi '^Permissions-Policy:' /tmp/headers
          curl --fail --silent http://127.0.0.1:5099/sitemap.xml | grep -Fq 'http://127.0.0.1:5099/talep-sorgula'

      - name: Check key page markers
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:5099/login | grep -Fq "Hesabınıza giriş yapın"
          curl --fail --silent http://127.0.0.1:5099/kayit | grep -Fq "Müşteri hesabı oluşturun"
          curl --fail --silent http://127.0.0.1:5099/urunler | grep -Fq "İNOKSKAR"

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/inokskar.log || true

      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/inokskar.pid ]; then
            kill "$(cat /tmp/inokskar.pid)" 2>/dev/null || true
          fi
