name: Windows IIS Publish Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-iis-publish:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: IndustrialCatalog/ClientApp/package-lock.json

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build browser application on Windows
        shell: pwsh
        working-directory: IndustrialCatalog/ClientApp
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed on Windows" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "React production build failed on Windows" }

      - name: Publish ASP.NET Core for IIS
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "inokskar-iis-publish"
          dotnet publish IndustrialCatalog/IndustrialCatalog.csproj --configuration Release --output "$out" -p:BuildClientApp=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed on Windows" }

          $expected = @("IndustrialCatalog.dll", "web.config", "wwwroot/index.html", "seed.json")
          foreach ($name in $expected) {
            $path = Join-Path $out $name
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing IIS output: $name" }
          }
          $web = Get-Content (Join-Path $out "web.config") -Raw
          if ($web -notmatch "AspNetCoreModuleV2") { throw "Missing ASP.NET Core IIS module" }
          if ($web -notmatch "IndustrialCatalog.dll") { throw "IIS entrypoint does not reference IndustrialCatalog.dll" }
          $static = Get-ChildItem (Join-Path $out "wwwroot") -Recurse -File
          if ($static.Count -lt 25) { throw "Frontend static asset count unusually small: $($static.Count)" }
          Write-Output "PASS: IIS publish has entrypoint, web.config, application and $($static.Count) static assets"

          $zip = Join-Path $env:RUNNER_TEMP "INOKSKAR-IIS-Publish.zip"
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "IIS ZIP missing" }
          "IIS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload verified IIS publish
        uses: actions/upload-artifact@v4
        with:
          name: INOKSKAR-IIS-Publish
          path: ${{ env.IIS_ZIP }}
          retention-days: 30
          if-no-files-found: error
